# RelayHarbor: Codemagic builds replace hosted GitHub Actions for Android.
# Repository: automationseDev/RelayHarbor-Public
workflows:
  relayharbor-pr:
    name: RelayHarbor PR Verification
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      java: 17
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: false
      cancel_previous_builds: true
    scripts:
      - name: Prepare Android / Gradle / Python
        script: bash tools/codemagic/setup.sh
      - name: Validate privacy, backend, Android unit tests
        script: bash tools/codemagic/verify.sh debug
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  relayharbor-release:
    name: RelayHarbor Signed APK Release
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      java: 17
      groups:
        - relayharbor_signing
        - relayharbor_github
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Prepare Android / Gradle / Python
        script: bash tools/codemagic/setup.sh
      - name: Build and verify production-signed APK
        script: bash tools/codemagic/verify.sh release
      - name: Publish GitHub release
        script: bash tools/codemagic/publish.sh
    artifacts:
      - dist/RelayHarbor-*.apk
      - dist/*.sha256
