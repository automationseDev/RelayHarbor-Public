name: Relay API Tests
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: relay/requirements.txt
      - run: pip install -r relay/requirements.txt pytest==8.3.5
      - run: pytest -q relay/test_server.py relay/test_connections.py relay/test_rss.py relay/test_connection_transfer.py
        env:
          PYTHONPATH: relay
      - name: Validate NAS deployment shell scripts
        run: bash -n relay/scripts/nas-*.sh
      - name: Build and inspect OCI image
        run: |
          docker build --tag relayharbor-relay:ci ./relay
          docker run --rm relayharbor-relay:ci python -c 'import server; import connections; print(server.app.version)'
