name: Android CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify public upgrade contract
        run: python3 scripts/check_public_contract.py
      - name: Compile and test
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Reject self-install permission in compiled APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT="$SDK/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump permissions "$APK" > "$RUNNER_TEMP/relayharbor-apk-permissions.txt"
          if grep -Fq 'android.permission.REQUEST_INSTALL_PACKAGES' "$RUNNER_TEMP/relayharbor-apk-permissions.txt"; then
            echo '::error::APK unexpectedly requests REQUEST_INSTALL_PACKAGES'
            exit 1
          fi
          echo 'Compiled APK has no REQUEST_INSTALL_PACKAGES permission.'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RelayHarbor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
