name: Publish Relay Docker Image (GHCR)

on:
  # Publish the matching stable Relay image after a successful signed Android release.
  workflow_run:
    workflows:
      - Signed APK Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      channel:
        description: 'Image channel: release publishes vX.Y.Z + stable; edge publishes edge'
        required: true
        type: choice
        default: release
        options:
          - release
          - edge

permissions:
  contents: read

concurrency:
  group: relay-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Validate tag and select image channel
        id: image
        shell: bash
        env:
          SELECTED_CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/$owner/relayharbor-public-relay"
          version=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Cannot determine Android app versionName"; exit 1;
          }
          release_tag="v$version"
          source_sha="$(git rev-parse HEAD)"
          short_sha="${source_sha:0:12}"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            [[ "$tag" == "$release_tag" ]] || {
              echo "::error::Git tag $tag does not match app version $release_tag"; exit 1;
            }
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
              echo "::error::Release tag must reference a commit in main"; exit 1;
            }
            channel=release
          elif [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            # Only the exact successful signed release commit may publish stable.
            git fetch --tags origin
            tagged_commit="$(git rev-parse --verify "refs/tags/$release_tag^{commit}")"
            [[ "$tagged_commit" == "$source_sha" ]] || {
              echo "::error::Signed release tag does not match the tested commit"; exit 1;
            }
            gh release view "$release_tag" >/dev/null || {
              echo "::error::Signed GitHub Release was not published"; exit 1;
            }
            channel=release
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || {
              echo "::error::Manual image publishing must run from main"; exit 1;
            }
            channel="$SELECTED_CHANNEL"
          else
            channel=edge
          fi

          {
            echo "image=$image"
            echo "release_tag=$release_tag"
            echo "channel=$channel"
            echo "short_sha=$short_sha"
            echo "tags<<EOF"
            echo "$image:sha-$short_sha"
            if [[ "$channel" == release ]]; then
              echo "$image:$release_tag"
              echo "$image:stable"
            else
              echo "$image:edge"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python for Relay tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: relay/requirements.txt

      - name: Run Relay tests
        shell: bash
        run: |
          python -m pip install -r relay/requirements.txt pytest==8.3.5
          PYTHONPATH=relay pytest -q relay/test_server.py relay/test_connections.py relay/test_rss.py relay/test_connection_transfer.py relay/test_slack_adapter.py

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish tested Relay image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./relay
          file: ./relay/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.release_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image reference and deployment help
        shell: bash
        run: |
          {
            echo "## RelayHarbor GHCR image published"
            echo ""
            echo "- Image: \`${{ steps.image.outputs.image }}\`"
            echo "- Channel: \`${{ steps.image.outputs.channel }}\`"
            echo "- Registry digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- NAS deploy: \`bash scripts/nas-deploy.sh ${{ steps.image.outputs.channel == 'release' && steps.image.outputs.release_tag || 'edge' }}\`"
            echo ""
            echo "Images may be **private** initially: NAS needs GHCR read:packages authentication."
            echo "NAS deployment is opt-in; this workflow never connects to the NAS."
          } >> "$GITHUB_STEP_SUMMARY"
